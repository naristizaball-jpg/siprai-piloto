<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIPRAI 2.9 Go-Live</title><style>
:root{--nav:#10233f;--blue:#1f4d8f;--bg:#f4f7fb;--line:#dbe4ef;--green:#287a55;--red:#a33;--amber:#a76f00}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:var(--bg);color:#172337}header{background:var(--nav);color:#fff;padding:18px 28px}
.wrap{max-width:1380px;margin:18px auto;padding:0 18px}.grid{display:grid;grid-template-columns:360px 1fr;gap:16px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
input,textarea,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;margin:5px 0 9px}button{background:var(--blue);color:white;border:0;border-radius:8px;padding:9px 11px;cursor:pointer;margin:2px}.secondary{background:#66788e}.danger{background:#933}
.hidden{display:none}.small{font-size:12px;color:#68788d}.ok{color:var(--green);font-weight:700}.warn{color:var(--amber);font-weight:700}.err{color:var(--red)}.chat{white-space:pre-wrap;border:1px solid var(--line);padding:10px;border-radius:8px;margin:8px 0}.ai{border-left:4px solid #6f52c9}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px;border-bottom:1px solid var(--line);text-align:left}.tabs button{background:#e9eef6;color:#244160}.tabs button.active{background:var(--blue);color:#fff}
@media(max-width:950px){.grid{grid-template-columns:1fr}}</style></head>
<body><header><h1>SIPRAI 2.9</h1><div>Go-Live del piloto académico</div></header><div class="wrap">
<div id="login" class="card" style="max-width:460px;margin:55px auto"><h2>Ingreso</h2><input id="email" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña"><button onclick="doLogin()">Ingresar</button><div id="loginmsg"></div></div>
<div id="app" class="hidden"><div class="grid">
<div>
<div class="card"><b id="who"></b><br><span id="role" class="small"></span><p><button class="secondary" onclick="showPwd()">Cambiar clave</button><button class="secondary" onclick="logout()">Salir</button></p></div>
<div class="card"><h3>Proyecto activo</h3><select id="projects" onchange="loadProject()"></select><div id="projectInfo" class="small"></div></div>
<div id="adminBox" class="card hidden"><h3>Administración</h3><div class="tabs">
<button onclick="adminTab('projectsTab')">Proyectos</button><button onclick="adminTab('usersTab')">Usuarios</button><button onclick="adminTab('systemTab')">Sistema</button>
</div>
<div id="projectsTab"><h4>Crear proyecto</h4><input id="newpid" placeholder="ID, ej. IA-2026-01"><input id="newptitle" placeholder="Título"><button onclick="createProject()">Crear</button><h4>Asignar estudiante</h4><select id="assignProject"></select><select id="assignUser"></select><button onclick="grant()">Asignar</button><div id="members"></div></div>
<div id="usersTab" class="hidden"><h4>Crear estudiante</h4><input id="newname" placeholder="Nombre"><input id="newemail" placeholder="Correo"><input id="newpass" placeholder="Contraseña temporal"><button onclick="createStudent()">Crear</button><div id="users"></div></div>
<div id="systemTab" class="hidden"><button onclick="systemStatus()">Estado</button><button onclick="makeBackup()">Crear backup</button><div id="system"></div><div id="backups"></div></div>
</div>
</div>
<div>
<div class="card"><h2>Profesor SIPRAI</h2><textarea id="msg" rows="5" placeholder="Consulte sobre la investigación..."></textarea><button onclick="ask()">Consultar</button><div id="chat"></div></div>
<div class="card"><h3>Expediente</h3><input id="title" placeholder="Título"><input id="stage" placeholder="Etapa"><input id="journal" placeholder="Revista objetivo"><textarea id="question" placeholder="Pregunta"></textarea><textarea id="objective" placeholder="Objetivo"></textarea><textarea id="method" placeholder="Método"></textarea><button onclick="saveProject()">Guardar</button><button class="secondary" onclick="exportProject()">Exportar JSON</button></div>
<div class="card"><h3>Archivos</h3><input id="file" type="file"><button onclick="upload()">Cargar</button><div id="files" class="small"></div></div>
</div></div></div>
<div id="pwdBox" class="card hidden" style="max-width:500px;position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:10"><h3>Cambiar contraseña</h3><input id="oldpwd" type="password" placeholder="Actual"><input id="newpwd" type="password" placeholder="Nueva (mínimo 10 caracteres)"><button onclick="changePwd()">Cambiar</button><button class="secondary" onclick="pwdBox.classList.add('hidden')">Cancelar</button></div>
</div><script>
let me=null,CSRF='';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function initCsrf(){let r=await fetch('/api/auth/csrf');let d=await r.json();CSRF=d.csrf}
async function api(url,opt={}){opt.headers=opt.headers||{};if((opt.method||'GET').toUpperCase()!=='GET')opt.headers['X-CSRF-Token']=CSRF;let r=await fetch(url,opt);if(!r.ok)throw Error(await r.text());return r}
async function doLogin(){try{if(!CSRF)await initCsrf();let d=await (await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})})).json();me=d.user;login.classList.add('hidden');app.classList.remove('hidden');who.textContent=me.name;role.textContent=me.role;if(me.role==='professor'){adminBox.classList.remove('hidden');await refreshAdmin()}await loadProjects()}catch(e){loginmsg.innerHTML='<span class=err>Ingreso no válido</span>'}}
async function logout(){await api('/api/auth/logout',{method:'POST'});location.reload()}
function showPwd(){pwdBox.classList.remove('hidden')}
async function changePwd(){try{await api('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current_password:oldpwd.value,new_password:newpwd.value})});alert('Contraseña actualizada');pwdBox.classList.add('hidden');oldpwd.value='';newpwd.value=''}catch(e){alert('No se pudo cambiar')}}
async function loadProjects(){let d=await (await api('/api/my/projects')).json();projects.innerHTML='';d.projects.forEach(p=>{let o=document.createElement('option');o.value=p;o.textContent=p;projects.appendChild(o)});if(d.projects.length)await loadProject();else projectInfo.textContent='Sin proyectos asignados.'}
async function loadProject(){let p=projects.value;if(!p)return;let d=await (await api('/api/project/'+encodeURIComponent(p))).json();let x=d.project;title.value=x.title||'';stage.value=x.stage||'';journal.value=x.journal||'';question.value=x.question||'';objective.value=x.objective||'';method.value=x.method||'';projectInfo.textContent=(x.stage||'Sin etapa')+' · '+(d.decisions||[]).length+' decisiones';files.innerHTML=(d.uploads||[]).map(f=>'• '+esc(f.original_name)+' ('+Math.round(f.size_bytes/1024)+' KB)').join('<br>')}
async function saveProject(){let p=projects.value;if(!p)return;await api('/api/project/'+encodeURIComponent(p),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title.value,stage:stage.value,journal:journal.value,question:question.value,objective:objective.value,method:method.value})});alert('Expediente guardado')}
async function ask(){let p=projects.value,m=msg.value.trim();if(!p||!m)return;chat.innerHTML+=`<div class=chat><b>Estudiante</b><br>${esc(m)}</div>`;msg.value='';let d=await (await api('/api/siprai/professor/'+encodeURIComponent(p),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})})).json();chat.innerHTML+=`<div class="chat ai"><b>SIPRAI</b><br>${esc(d.answer)}</div>`}
async function upload(){let p=projects.value,f=file.files[0];if(!p||!f)return;let fd=new FormData();fd.append('file',f);await api('/api/project/'+encodeURIComponent(p)+'/upload',{method:'POST',body:fd});file.value='';await loadProject()}
function exportProject(){let p=projects.value;if(p)location.href='/api/project/'+encodeURIComponent(p)+'/export'}
function adminTab(id){['projectsTab','usersTab','systemTab'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
async function refreshAdmin(){await loadUsers();let d=await (await api('/api/admin/dashboard')).json();assignProject.innerHTML='';d.projects.forEach(x=>{let o=document.createElement('option');o.value=x.id;o.textContent=x.id+' · '+(x.title||'');assignProject.appendChild(o)});if(d.projects.length)loadMembers()}
async function loadUsers(){let d=await (await api('/api/admin/users')).json();assignUser.innerHTML='';d.users.filter(u=>u.role==='student'&&u.active).forEach(u=>{let o=document.createElement('option');o.value=u.id;o.textContent=u.name+' · '+u.email;assignUser.appendChild(o)});users.innerHTML='<table><tr><th>Nombre</th><th>Correo</th><th>Estado</th><th>Acción</th></tr>'+d.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${u.active?'Activo':'Inactivo'}</td><td><button onclick="resetPwd(${u.id})">Reset</button><button class="${u.active?'danger':''}" onclick="toggleUser(${u.id},${u.active?0:1})">${u.active?'Desactivar':'Activar'}</button></td></tr>`).join('')+'</table>'}
async function createStudent(){let d=await (await api('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:newname.value,email:newemail.value,password:newpass.value,role:'student'})})).json();alert('Cuenta creada, ID '+d.user_id);await refreshAdmin()}
async function createProject(){let id=newpid.value.trim();if(!id)return;await api('/api/admin/project/'+encodeURIComponent(id)+'/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:newptitle.value,stage:'Descubrimiento'})});alert('Proyecto creado');newpid.value='';newptitle.value='';await refreshAdmin();await loadProjects()}
async function grant(){let p=assignProject.value,u=assignUser.value;if(!p||!u)return;await api('/api/admin/project/'+encodeURIComponent(p)+'/grant/'+u,{method:'POST'});alert('Estudiante asignado');await loadMembers()}
async function loadMembers(){let p=assignProject.value;if(!p)return;let d=await (await api('/api/admin/project/'+encodeURIComponent(p)+'/members')).json();members.innerHTML='<h4>Miembros</h4>'+d.members.map(x=>'• '+esc(x.name)+' · '+esc(x.email)+'<br>').join('')}
async function resetPwd(id){let d=await (await api('/api/admin/users/'+id+'/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})).json();alert('Contraseña temporal: '+d.temporary_password+'\\nDebe comunicarse al usuario de forma segura.')}
async function toggleUser(id,a){await api('/api/admin/users/'+id+'/active',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({active:!!a})});await loadUsers()}
async function systemStatus(){let d=await (await api('/api/admin/system-status')).json();system.innerHTML='<pre>'+esc(JSON.stringify(d,null,2))+'</pre>';await loadBackups()}
async function makeBackup(){await api('/api/admin/backup',{method:'POST'});alert('Backup creado');await loadBackups()}
async function loadBackups(){let d=await (await api('/api/admin/backups')).json();backups.innerHTML='<h4>Backups</h4>'+d.backups.map(b=>`<a href="/api/admin/backups/${encodeURIComponent(b.name)}">${esc(b.name)}</a><br>`).join('')}
initCsrf();
</script></body></html>
