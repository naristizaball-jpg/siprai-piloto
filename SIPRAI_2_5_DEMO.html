<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIPRAI 2.5</title>
<style>body{font-family:Segoe UI,Arial;margin:0;background:#f4f7fb;color:#172337}header{background:#10233f;color:#fff;padding:18px 28px}.wrap{max-width:1280px;margin:20px auto;padding:0 18px}.grid{display:grid;grid-template-columns:430px 1fr;gap:16px}.card{background:#fff;border:1px solid #dbe4ef;border-radius:14px;padding:16px;margin-bottom:15px}input,textarea{width:100%;padding:9px;border:1px solid #dbe4ef;border-radius:8px;margin:5px 0 9px}button{background:#1f4d8f;color:#fff;border:0;border-radius:8px;padding:9px 12px;cursor:pointer}.chat{white-space:pre-wrap;padding:11px;border:1px solid #dbe4ef;border-radius:9px;margin:8px 0}.ai{border-left:4px solid #6f52c9}.small{font-size:12px;color:#68788d}.ev{background:#f7f9fc;border:1px solid #dbe4ef;padding:9px;border-radius:8px;margin:6px 0}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head>
<body><header><h1>SIPRAI 2.5</h1><div>Profesor grounded en documentos + expediente + decisiones</div></header><div class="wrap"><div class="grid">
<div><div class="card"><h2>Expediente del proyecto</h2><input id="pid" value="PILOTO-001"><input id="title" placeholder="Título"><input id="stage" placeholder="Etapa"><input id="journal" placeholder="Revista objetivo"><textarea id="question" placeholder="Pregunta"></textarea><textarea id="objective" placeholder="Objetivo"></textarea><textarea id="method" placeholder="Método"></textarea><button onclick="saveProject()">Guardar contexto</button></div><div class="card"><h2>Modo</h2><div id="mode" class="small"></div></div></div>
<div><div class="card"><h2>Profesor SIPRAI</h2><textarea id="msg" rows="5" placeholder="Pregunte sobre la investigación..."></textarea><button onclick="ask()">Consultar</button><div id="chat"></div></div><div class="card"><h2>Evidencia documental</h2><div id="evidence" class="small">Sin consulta.</div></div></div>
</div></div><script>
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function saveProject(){let p=pid.value.trim();let body={title:title.value,stage:stage.value,journal:journal.value,question:question.value,objective:objective.value,method:method.value};await fetch('/api/project/'+encodeURIComponent(p),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});alert('Proyecto guardado')}
async function ask(){let p=pid.value.trim(),m=msg.value.trim();if(!m)return;chat.innerHTML+=`<div class="chat"><b>Estudiante</b><br>${esc(m)}</div>`;msg.value='';let r=await fetch('/api/siprai/professor/'+encodeURIComponent(p),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});let d=await r.json();chat.innerHTML+=`<div class="chat ai"><b>SIPRAI</b><br>${esc(d.answer)}</div>`;evidence.innerHTML=(d.evidence||[]).map(x=>`<div class="ev"><b>[D${esc(x.doc)} p.${esc(x.page)}]</b><br>${esc(x.snippet.slice(0,450))}</div>`).join('')||'Sin evidencia recuperada.'}
fetch('/api/siprai/mode').then(r=>r.json()).then(d=>mode.textContent='Proveedor: '+d.provider+' · IA configurada: '+d.ai_configured)
</script></body></html>
